# fledgetone.com: Netlify builds the site from this repository on every push to master. The home
# page (site/) is at /, the studio at /app/ (npm run build:site, see scripts/build-site.mjs). The
# GPL plugins are never published (they're only for builds made with npm run build:full), so the
# build leaves their folder out.
[build]
  command = "npm run build:site"
  publish = "dist-site"

[build.environment]
  NODE_VERSION = "22"

# The studio used to be at the root: its old addresses go to /app/ (share links, #s=..., are
# forwarded by a line of script in site/index.html, since the part after # never reaches a server)
[[redirects]]
  from = "/fledgetone-samples/*"
  to = "/app/fledgetone-samples/:splat"
  status = 301

[[redirects]]
  from = "/fledgetone-plugins/*"
  to = "/app/fledgetone-plugins/:splat"
  status = 301

# How long browsers keep each file: public/_headers (the app's rules), which scripts/build-site.mjs
# moves to the top of the site with /app/ in front of each address and the home page's rules added.
# Keep header rules there only, so the two don't both set one.
