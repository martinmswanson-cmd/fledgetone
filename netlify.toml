# fledgetone.com: Netlify builds the app from this repository on every push to master.
# The GPL plugins are never published (they're only for builds made with npm run build:full),
# so the build removes their folder from what Vite copied out of public/.
[build]
  command = "npm run build && rm -rf dist/fledgetone-plugins/gpl"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# How long browsers keep each file (the app, the recordings, the service worker): public/_headers,
# which Vite copies into dist/. Keep header rules there only, so the two don't both set one.
