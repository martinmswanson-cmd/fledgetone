# fledgetone.com: Netlify builds the app from this repository on every push to master.
# The GPL plugins are never published (they're only for builds made with npm run build:full),
# so the build removes their folder from what Vite copied out of public/.
[build]
  command = "npm run build && rm -rf dist/bos-beat-box-plugins/gpl"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Instrument recordings and plugins rarely change: let browsers keep them a day
[[headers]]
  for = "/bos-beat-box-samples/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/bos-beat-box-plugins/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"
