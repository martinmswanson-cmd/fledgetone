[package]
name = "fledge-spectral"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fledge Spectral: work on a sound by its spectrum (freeze it, blur it in time, smear it across pitch, gate out its quiet parts). Built to WebAssembly for Fledgetone, and as a Rust library."
repository = "https://github.com/martinmswanson-cmd/fledgetone"

[lib]
# cdylib: the WebAssembly family the app loads; rlib: the effect as a Rust library
crate-type = ["cdylib", "rlib"]

[dependencies]
fledge-dsp = { path = "../fledge-dsp", version = "0.1.0" }
fledge-plugin = { path = "../fledge-plugin", version = "0.1.0" }
fledge-wasm = { path = "../fledge-wasm", version = "0.1.0" }

[lints]
workspace = true
