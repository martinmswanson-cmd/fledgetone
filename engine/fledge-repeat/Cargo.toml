[package]
name = "fledge-repeat"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fledge Repeat: a beat repeat in time with the song (stutters, rolls, fills). Built to WebAssembly for Fledgetone, and as a Rust library."
repository = "https://github.com/martinmswanson-cmd/fledgetone"

[lib]
# cdylib: the WebAssembly family the app loads; rlib: the repeat as a Rust library
crate-type = ["cdylib", "rlib"]

[dependencies]
fledge-plugin = { path = "../fledge-plugin", version = "0.1.0" }
fledge-wasm = { path = "../fledge-wasm", version = "0.1.0" }

[lints]
workspace = true
