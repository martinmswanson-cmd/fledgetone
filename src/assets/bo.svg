  <path d="M12 44 C12 9 108 9 108 44" fill="none" stroke="#3d9ee0" stroke-width="3.2" stroke-linecap="round"/>
  <!-- ear cups -->
  <rect x="3" y="36" width="17" height="27" rx="7" fill="#3d9ee0" stroke="#2b2140" stroke-width="3.5"/>
  <rect x="100" y="36" width="17" height="27" rx="7" fill="#3d9ee0" stroke="#2b2140" stroke-width="3.5"/>
  <rect x="7" y="41" width="5" height="17" rx="2.5" fill="#fff" opacity="0.45"/>
  <rect x="104" y="41" width="5" height="17" rx="2.5" fill="#fff" opacity="0.45"/>
  <!-- eyes (looking up a little, happy) -->
  <circle cx="48" cy="52" r="8.5" fill="#fff" stroke="#2b2140" stroke-width="2.5"/>
  <circle cx="72" cy="52" r="8.5" fill="#fff" stroke="#2b2140" stroke-width="2.5"/>
  <circle cx="49" cy="51" r="4.2" fill="#2b2140"/>
  <circle cx="73" cy="51" r="4.2" fill="#2b2140"/>
  <circle cx="50.5" cy="49.5" r="1.4" fill="#fff"/>
  <circle cx="74.5" cy="49.5" r="1.4" fill="#fff"/>
