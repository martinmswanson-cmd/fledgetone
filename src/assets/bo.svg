<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Bo wearing headphones -->
  <!-- legs -->
  <path d="M45 74 L43 103" stroke="#2b2140" stroke-width="11" stroke-linecap="round"/>
  <path d="M45 74 L43 103" stroke="#e9dcc0" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M75 74 L77 103" stroke="#2b2140" stroke-width="11" stroke-linecap="round"/>
  <path d="M75 74 L77 103" stroke="#e9dcc0" stroke-width="6.5" stroke-linecap="round"/>
  <ellipse cx="41" cy="107" rx="10" ry="5.5" fill="#2b2140"/>
  <ellipse cx="79" cy="107" rx="10" ry="5.5" fill="#2b2140"/>
  <!-- stone body + blue band -->
  <path d="M18 38 a42 13 0 0 1 84 0 v24 a42 13 0 0 1 -84 0 z" fill="#fffaf0" stroke="#2b2140" stroke-width="4" stroke-linejoin="round"/>
  <path d="M18 57 a42 13 0 0 0 84 0 v8 a42 13 0 0 1 -84 0 z" fill="#3d9ee0" stroke="#2b2140" stroke-width="2.5" stroke-linejoin="round"/>
